<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Splitfilling - Finanças & Fluxo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .main-content { height: calc(100vh - 80px); }
    </style>
</head>
<body class="bg-gray-900 text-white font-sans overflow-hidden">
    <div class="flex h-screen w-screen">
        <div id="sidebar-container"></div>

        <div class="flex flex-col flex-1 overflow-hidden">
            <div id="header-container"></div>

            <main class="main-content overflow-y-auto p-10 bg-black/30 no-scrollbar">
                
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-10 mb-10">
                    <div class="space-y-6">
                        <h3 class="text-2xl font-bold text-red-500 italic">Registrar Saída 💸</h3>
                        <div class="bg-gray-800/40 p-8 rounded-3xl border border-gray-700 shadow-2xl">
                            <form id="formDespesa" class="space-y-4">
                                <input type="text" id="desc-despesa" placeholder="Descrição (Ex: Combustível, Aluguel)" class="w-full bg-gray-900 p-4 rounded-xl border border-gray-700 outline-none focus:border-red-500 transition" required>
                                <div class="grid grid-cols-2 gap-4">
                                    <input type="number" step="0.01" id="valor-despesa" placeholder="Valor R$" class="w-full bg-gray-900 p-4 rounded-xl border border-gray-700 outline-none focus:border-red-500 transition" required>
                                    <select id="cat-despesa" class="w-full bg-gray-900 p-4 rounded-xl border border-gray-700 outline-none">
                                        <option value="Compra de Mercadoria">Compra de Mercadoria</option>
                                        <option value="Embalagem">Embalagem</option>
                                        <option value="Logística/Gasolina">Logística / Gasolina</option>
                                        <option value="Marketing">Marketing</option>
                                        <option value="Infraestrutura">Infraestrutura</option>
                                        <option value="Outros">Outros</option>
                                    </select>
                                </div>
                                <button type="submit" class="w-full bg-red-600 p-4 rounded-xl font-bold hover:bg-red-700 transition uppercase tracking-widest shadow-lg shadow-red-900/20">Salvar Despesa</button>
                            </form>
                        </div>
                    </div>

                    <div class="space-y-6">
                        <h3 class="text-2xl font-bold text-blue-400 italic">Contas a Receber (Prazo) ⏳</h3>
                        <div id="lista-pendentes" class="space-y-4 max-h-[300px] overflow-y-auto pr-2 no-scrollbar">
                            <p class="text-gray-500 italic">Buscando dívidas no sistema...</p>
                        </div>
                    </div>
                </div>

                <div class="space-y-6">
                    <h3 class="text-2xl font-bold text-green-500 italic">Últimas Movimentações 📊</h3>
                    <div class="bg-gray-800/40 rounded-3xl border border-gray-700 overflow-hidden shadow-2xl">
                        <table class="w-full text-left">
                            <thead class="bg-black/40 text-gray-400 text-xs uppercase tracking-widest">
                                <tr>
                                    <th class="p-5 font-bold">Data</th>
                                    <th class="p-5 font-bold">Tipo</th>
                                    <th class="p-5 font-bold">Descrição / Cliente</th>
                                    <th class="p-5 font-bold text-right">Valor</th>
                                    <th class="p-5 font-bold text-center">Ações</th>
                                </tr>
                            </thead>
                            <tbody id="lista-movimentacoes" class="divide-y divide-gray-800">
                                </tbody>
                        </table>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <script type="module">
        import { supabase } from '../supabaseClient.js';

        async function init() {
            // Carregar componentes globais [cite: 570]
            const [sb, hd] = await Promise.all([
                fetch('../sidebar.html').then(r => r.text()),
                fetch('../header.html').then(r => r.text())
            ]);
            document.getElementById('sidebar-container').innerHTML = sb;
            document.getElementById('header-container').innerHTML = hd;
            document.getElementById('page-title').innerText = "Fluxo de Caixa";
            
            loadPendentes();
            loadMovimentacoes();
        }

        // Carregar vendas com status pendente (Contas a Receber) [cite: 513]
        async function loadPendentes() {
            const { data, error } = await supabase
                .from('vendas')
                .select('*, clientes(nome_loja)')
                .eq('status', 'pendente')
                .order('data_vencimento', { ascending: true });

            const container = document.getElementById('lista-pendentes');
            if (error || !data || data.length === 0) {
                container.innerHTML = "<p class='text-gray-500 text-sm'>Nenhum pagamento pendente encontrado.</p>";
                return;
            }

            container.innerHTML = data.map(v => `
                <div class="bg-blue-900/10 border border-blue-500/20 p-5 rounded-2xl flex justify-between items-center group hover:border-blue-500/50 transition">
                    <div>
                        <p class="font-bold text-white text-lg">${v.clientes?.nome_loja || "Venda Direta"}</p>
                        <p class="text-[10px] text-blue-400 uppercase font-bold tracking-widest">Vence em: ${new Date(v.data_vencimento).toLocaleDateString()}</p>
                    </div>
                    <div class="text-right">
                        <p class="font-mono font-bold text-white text-xl">R$ ${v.valor_total.toFixed(2)}</p>
                        <button onclick="baixarVenda('${v.id}')" class="text-[10px] bg-blue-600 hover:bg-blue-500 px-4 py-1.5 rounded-full font-black mt-2 transition">RECEBER AGORA</button>
                    </div>
                </div>
            `).join('');
        }

        // Carregar movimentações (Entradas de Vendas + Saídas de Despesas) [cite: 594]
        async function loadMovimentacoes() {
            const [{ data: vendas }, { data: despesas }] = await Promise.all([
                supabase.from('vendas').select('*, clientes(nome_loja)').eq('status', 'pago').order('data_venda', { ascending: false }).limit(15),
                supabase.from('despesas').select('*').order('data_saida', { ascending: false }).limit(15)
            ]);

            const movimentacoes = [
                ...(vendas || []).map(v => ({ id: v.id, data: v.data_venda, tipo: 'entrada', desc: v.clientes?.nome_loja || "Venda Balcão", valor: v.valor_total, editavel: false })),
                ...(despesas || []).map(d => ({ id: d.id, data: d.data_saida, tipo: 'saida', desc: d.descricao, valor: d.valor, editavel: true }))
            ];

            // Ordenar por data (mais recente primeiro) [cite: 596]
            movimentacoes.sort((a, b) => new Date(b.data) - new Date(a.data));

            const tbody = document.getElementById('lista-movimentacoes');
            if (movimentacoes.length === 0) {
                tbody.innerHTML = "<tr><td colspan='5' class='p-5 text-center text-gray-500'>Sem movimentações registradas.</td></tr>";
                return;
            }

            tbody.innerHTML = movimentacoes.slice(0, 20).map(m => `
                <tr id="row-${m.id}" class="hover:bg-white/5 transition border-l-4 ${m.tipo === 'entrada' ? 'border-green-500' : 'border-red-500'}">
                    <td class="p-5 text-sm text-gray-400 font-mono">${new Date(m.data).toLocaleDateString()}</td>
                    <td class="p-5">
                        <span class="px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-tighter ${m.tipo === 'entrada' ? 'bg-green-500/10 text-green-500' : 'bg-red-500/10 text-red-500'}">
                            ${m.tipo}
                        </span>
                    </td>
                    <td class="p-5 font-bold text-gray-200" id="desc-container-${m.id}">
                        ${m.desc}
                    </td>
                    <td class="p-5 text-right font-mono font-bold text-lg ${m.tipo === 'entrada' ? 'text-green-500' : 'text-red-500'}" id="valor-container-${m.id}">
                        ${m.tipo === 'entrada' ? '+' : '-'} R$ ${m.valor.toFixed(2)}
                    </td>
                    <td class="p-5 text-center">
                        ${m.editavel ? `
                            <button id="btn-edit-${m.id}" onclick="habilitarEdicao('${m.id}', '${m.desc}', ${m.valor}, '${m.tipo}')" class="text-xs bg-gray-700 hover:bg-gray-600 px-3 py-1 rounded-lg transition font-bold">Editar</button>
                        ` : `<span class="text-xs text-gray-600 italic">Venda (Fixa)</span>`}
                    </td>
                </tr>
            `).join('');
        }

        // Nova função para injetar inputs e permitir a edição direta na tabela
        window.habilitarEdicao = (id, descAtual, valorAtual, tipo) => {
            const descTd = document.getElementById(`desc-container-${id}`);
            const valorTd = document.getElementById(`valor-container-${id}`);
            const btnCell = document.getElementById(`btn-edit-${id}`);

            // Transforma os textos em inputs com estilo escuro do app
            descTd.innerHTML = `<input type="text" id="input-edit-desc-${id}" value="${descAtual}" class="bg-gray-900 border border-gray-700 p-2 rounded-lg text-sm w-full outline-none focus:border-blue-500 text-white">`;
            valorTd.innerHTML = `<input type="number" step="0.01" id="input-edit-valor-${id}" value="${valorAtual}" class="bg-gray-900 border border-gray-700 p-2 rounded-lg text-sm w-28 text-right outline-none focus:border-blue-500 text-white">`;

            // Transforma o botão de Editar em Salvar
            btnCell.outerHTML = `<button id="btn-edit-${id}" onclick="salvarEdicao('${id}', '${tipo}')" class="text-xs bg-green-600 hover:bg-green-500 px-3 py-1 rounded-lg transition font-bold text-black">Salvar</button>`;
        };

        // Salvar a alteração direto no Supabase
        window.salvarEdicao = async (id, tipo) => {
            const novaDesc = document.getElementById(`input-edit-desc-${id}`).value;
            const novoValor = parseFloat(document.getElementById(`input-edit-valor-${id}`).value);

            if (!novaDesc || isNaN(novoValor) || novoValor <= 0) {
                alert("Por favor, preencha os campos com valores válidos!");
                return;
            }

            // Atualiza a tabela 'despesas' na nuvem
            const { error } = await supabase
                .from('despesas')
                .update({ descricao: novaDesc, valor: novoValor })
                .eq('id', id);

            if (error) {
                alert("Erro ao salvar alteração: " + error.message);
            } else {
                loadMovimentacoes(); // Recarrega a tabela limpa e editada
            }
        };

        // Gravar nova Despesa [cite: 512]
        document.getElementById('formDespesa').onsubmit = async (e) => {
            e.preventDefault();
            const desc = document.getElementById('desc-despesa').value;
            const valor = parseFloat(document.getElementById('valor-despesa').value);
            const cat = document.getElementById('cat-despesa').value;

            const { error } = await supabase.from('despesas').insert([{
                descricao: desc,
                valor: valor,
                categoria: cat
            }]);

            if (error) {
                alert("Erro ao salvar: " + error.message);
            } else {
                e.target.reset();
                loadMovimentacoes();
            }
        };

        // Função global para dar baixa em venda pendente [cite: 514]
        window.baixarVenda = async (id) => {
            const { error } = await supabase
                .from('vendas')
                .update({ status: 'pago' })
                .eq('id', id);

            if (!error) {
                loadPendentes();
                loadMovimentacoes();
            }
        };

        init();
    </script>
</body>
</html>
