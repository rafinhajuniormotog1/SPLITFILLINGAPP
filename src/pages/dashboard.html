<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Splitfilling - Dashboard Mestre</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Ajuste fino de altura para a rolagem interna */
        .main-content { height: calc(100vh - 75px); }
        @media (min-width: 1024px) { .main-content { height: calc(100vh - 80px); } }
    </style>
</head>
<body class="bg-gray-950 text-white font-sans overflow-hidden">
    
    <div class="flex h-screen w-screen overflow-hidden">
        <div id="sidebar-container" class="no-print"></div>

        <div class="flex flex-col flex-1 min-w-0 overflow-hidden">
            <div id="header-container" class="no-print"></div>

            <main class="main-content overflow-y-auto p-4 sm:p-6 md:p-8 bg-black/20 no-scrollbar pt-[90px] lg:pt-[100px]">
                
                <div class="max-w-6xl mx-auto space-y-6">
                    
                    <div class="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4 border-b border-gray-900 pb-4">
                        <div>
                            <h2 class="text-2xl sm:text-3xl font-black italic text-green-500 uppercase tracking-tight">Visão Geral</h2>
                            <p class="text-gray-500 text-xs uppercase tracking-wider mt-0.5">Saúde financeira em tempo real da distribuidora</p>
                        </div>
                        
                        <div class="flex flex-wrap items-center gap-2 bg-gray-900 p-2.5 rounded-2xl border border-gray-800 w-full lg:w-auto">
                            <div class="flex items-center flex-1 sm:flex-none">
                                <span class="text-[10px] text-gray-500 uppercase font-black px-1">De:</span>
                                <input type="date" id="data-inicio" class="bg-transparent text-xs p-1 outline-none text-white font-mono">
                            </div>
                            <div class="flex items-center flex-1 sm:flex-none border-l border-gray-800 pl-2">
                                <span class="text-[10px] text-gray-500 uppercase font-black px-1">Até:</span>
                                <input type="date" id="data-fim" class="bg-transparent text-xs p-1 outline-none text-white font-mono">
                            </div>
                            <button onclick="loadDashboardData()" class="w-full sm:w-auto bg-green-600 hover:bg-green-500 text-black px-4 py-2.5 rounded-xl text-xs font-black uppercase tracking-widest transition active:scale-95 sm:ml-2">
                                Filtrar 🔍
                            </button>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                        <div class="bg-gray-900/40 p-5 rounded-3xl border border-gray-800/80 shadow-lg">
                            <p class="text-gray-500 text-[10px] uppercase font-black tracking-widest">Faturamento Período</p>
                            <h3 id="vendas-total" class="text-2xl sm:text-3xl font-black mt-1 font-mono text-white">R$ 0,00</h3>
                        </div>
                        <div class="bg-gray-900/40 p-5 rounded-3xl border border-gray-800/80 shadow-lg">
                            <p class="text-gray-500 text-[10px] uppercase font-black tracking-widest">Patrimônio (Custo)</p>
                            <h3 id="custo-estoque" class="text-2xl sm:text-3xl font-black mt-1 text-blue-400 font-mono">R$ 0,00</h3>
                        </div>
                        <div class="bg-gray-900/40 p-5 rounded-3xl border border-gray-800/80 shadow-lg">
                            <p class="text-gray-500 text-[10px] uppercase font-black tracking-widest">Estoque Disponível</p>
                            <h3 id="qtd-estoque" class="text-2xl sm:text-3xl font-black mt-1 text-green-400 font-mono">0 un</h3>
                        </div>
                        <div class="bg-gray-900/40 p-5 rounded-3xl border border-gray-800/80 shadow-lg">
                            <p class="text-gray-500 text-[10px] uppercase font-black tracking-widest">Lojistas Cadastrados</p>
                            <h3 id="clientes-total" class="text-2xl sm:text-3xl font-black mt-1 text-purple-400 font-mono">0</h3>
                        </div>
                    </div>

                    <div class="bg-gray-900/30 p-4 sm:p-6 rounded-[32px] border border-gray-800/60 shadow-2xl">
                        <h4 class="text-xs font-black text-gray-400 uppercase tracking-widest mb-4">📈 Tendência de Faturamento</h4>
                        <div class="h-56 sm:h-64 w-full relative">
                            <canvas id="chartVendas"></canvas>
                        </div>
                    </div>

                    <div class="bg-gray-900/20 rounded-[32px] border border-gray-800 overflow-hidden shadow-xl">
                        <div class="p-5 border-b border-gray-900 bg-black/20 flex justify-between items-center">
                            <h4 class="text-xs font-black uppercase tracking-widest">📋 Últimas Vendas Balcão</h4>
                            <span class="text-[9px] bg-green-500/10 text-green-400 px-3 py-1 rounded-full font-black tracking-widest animate-pulse">LIVE</span>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse">
                                <thead class="bg-black/30 text-gray-500 text-[10px] uppercase tracking-wider font-bold">
                                    <tr>
                                        <th class="p-4">Data</th>
                                        <th class="p-4">Cliente / Loja</th>
                                        <th class="p-4 text-right">Valor</th>
                                    </tr>
                                </thead>
                                <tbody id="lista-extrato" class="divide-y divide-gray-900/60 text-sm">
                                    <tr>
                                        <td colspan="3" class="p-8 text-center text-gray-500 uppercase tracking-widest text-xs font-bold animate-pulse">
                                            Buscando movimentações...
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>

                </div>
            </main>
        </div>
    </div>

    <script type="module">
        import { supabase } from '../supabaseClient.js';

        let chartInstance = null;

        async function loadUI() {
            try {
                const [sb, hd] = await Promise.all([
                    fetch('../sidebar.html').then(r => r.text()),
                    fetch('../header.html').then(r => r.text())
                ]);
                document.getElementById('sidebar-container').innerHTML = sb;
                document.getElementById('header-container').innerHTML = hd;

                // Ativa a lógica do menu hambúrguer responsivo
                const scripts = document.getElementById('sidebar-container').getElementsByTagName('script');
                for (let script of scripts) { eval(script.text); }

                document.getElementById('page-title').innerText = "Dashboard Mestre";
                
                await loadDashboardData();
            } catch (err) {
                console.error("Erro na injeção dos templates:", err);
            }
        }

        async function loadDashboardData() {
            const dataInicio = document.getElementById('data-inicio').value;
            const dataFim = document.getElementById('data-fim').value;

            // 1. Dados de Estoque
            const { data: produtos } = await supabase.from('produtos').select('estoque_atual, preco_custo');
            if (produtos) {
                const totalQtd = produtos.reduce((acc, p) => acc + (p.estoque_atual || 0), 0);
                const totalCusto = produtos.reduce((acc, p) => acc + ((p.estoque_atual || 0) * (p.preco_custo || 0)), 0);
                document.getElementById('qtd-estoque').innerText = `${totalQtd} un`;
                document.getElementById('custo-estoque').innerText = `R$ ${totalCusto.toFixed(2)}`;
            }

            // 2. Dados de Clientes
            const { count } = await supabase.from('clientes').select('*', { count: 'exact', head: true });
            document.getElementById('clientes-total').innerText = count || 0;

            // 3. Vendas e Filtros por Data
            let queryVendas = supabase.from('vendas').select('*, clientes(nome_loja)').order('data_venda', { ascending: true });
            
            if (dataInicio) queryVendas = queryVendas.gte('data_venda', dataInicio + 'T00:00:00');
            if (dataFim) queryVendas = queryVendas.lte('data_venda', dataFim + 'T23:59:59');

            const { data: vendas } = await queryVendas;

            if (vendas) {
                const totalVendas = vendas.reduce((acc, v) => acc + (v.valor_total || 0), 0);
                document.getElementById('vendas-total').innerText = `R$ ${totalVendas.toFixed(2)}`;
                
                renderExtrato(vendas);
                renderChart(vendas);
            }
        }

        function renderExtrato(vendas) {
            const tbody = document.getElementById('lista-extrato');
            if (!vendas || vendas.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" class="p-6 text-center text-gray-500 uppercase tracking-widest text-xs">Sem vendas encontradas.</td></tr>`;
                return;
            }
            const ultimas = [...vendas].reverse().slice(0, 5);
            
            tbody.innerHTML = ultimas.map(v => `
                <tr class="text-sm hover:bg-gray-900/30 transition-all border-b border-gray-900/40">
                    <td class="p-4 text-gray-500 font-mono">${new Date(v.data_venda).toLocaleDateString()}</td>
                    <td class="p-4 font-bold text-white">${v.clientes?.nome_loja || 'Cliente Balcão'}</td>
                    <td class="p-4 text-right font-mono font-bold text-green-400">R$ ${v.valor_total.toFixed(2)}</td>
                </tr>
            `).join('');
        }

        function renderChart(vendas) {
            const canvas = document.getElementById('chartVendas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            
            const labels = [...new Set(vendas.map(v => new Date(v.data_venda).toLocaleDateString()))];
            const dataValues = labels.map(label => {
                return vendas
                    .filter(v => new Date(v.data_venda).toLocaleDateString() === label)
                    .reduce((acc, v) => acc + v.valor_total, 0);
            });

            if (chartInstance) chartInstance.destroy();

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Vendas (R$)',
                        data: dataValues,
                        borderColor: '#22c55e',
                        backgroundColor: 'rgba(34, 197, 94, 0.05)',
                        fill: true,
                        tension: 0.3,
                        borderWidth: 3,
                        pointRadius: 3,
                        pointBackgroundColor: '#22c55e'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { grid: { color: '#111827' }, ticks: { color: '#6b7280', font: { size: 10 } } },
                        x: { grid: { display: false }, ticks: { color: '#6b7280', font: { size: 10 } } }
                    }
                }
            });
        }

        window.loadDashboardData = loadDashboardData;
        loadUI();
    </script>
</body>
</html>
