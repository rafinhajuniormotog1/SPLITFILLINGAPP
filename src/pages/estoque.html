<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Splitfilling - Gestão de Estoque & Custos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .main-content { height: calc(100vh - 80px); }
    </style>
</head>
<body class="bg-gray-900 text-white font-sans overflow-hidden">
    
    <div class="flex h-screen w-screen">
        <div id="sidebar-container"></div>

        <div class="flex flex-col flex-1 overflow-hidden">
            <div id="header-container"></div>

            <main class="main-content overflow-y-auto p-10 bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-gray-800 via-gray-900 to-black no-scrollbar">
                
                <div class="flex justify-between items-center mb-8">
                    <div>
                        <h3 class="text-2xl font-bold text-green-500 italic">Inventário & Finanças</h3>
                        <p class="text-sm text-gray-500">Controle de entradas, saídas e patrimônio em estoque.</p>
                    </div>
                    <button onclick="abrirModal()" class="bg-green-600 hover:bg-green-700 text-white px-8 py-3 rounded-2xl font-bold transition shadow-lg shadow-green-900/20">
                        + Novo Produto
                    </button>
                </div>

                <!-- PAINEL DE RESUMO FINANCEIRO -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
                    <div class="bg-gray-800/60 p-6 rounded-3xl border border-gray-700 shadow-xl">
                        <p class="text-gray-500 text-xs font-bold uppercase tracking-widest">Patrimônio (Custo Total)</p>
                        <h3 id="resumo-custo-total" class="text-2xl font-bold mt-2 text-blue-400 font-mono">R$ 0,00</h3>
                    </div>
                    <div class="bg-gray-800/60 p-6 rounded-3xl border border-gray-700 shadow-xl">
                        <p class="text-gray-500 text-xs font-bold uppercase tracking-widest">Potencial de Venda</p>
                        <h3 id="resumo-venda-total" class="text-2xl font-bold mt-2 text-green-400 font-mono">R$ 0,00</h3>
                    </div>
                    <div class="bg-gray-800/60 p-6 rounded-3xl border border-gray-700 shadow-xl">
                        <p class="text-gray-500 text-xs font-bold uppercase tracking-widest">Lucro Estimado (Bruto)</p>
                        <h3 id="resumo-lucro-total" class="text-2xl font-bold mt-2 text-white font-mono">R$ 0,00</h3>
                    </div>
                </div>

                <!-- Tabela de Gestão -->
                <div class="bg-gray-800/40 backdrop-blur-md rounded-3xl border border-gray-700 overflow-hidden shadow-2xl">
                    <table class="w-full text-left">
                        <thead class="bg-black/40 text-gray-400 text-xs uppercase tracking-widest">
                            <tr>
                                <th class="p-6">Produto</th>
                                <th class="p-6 text-center">Saldo</th>
                                <th class="p-6 text-center">Custo Unit.</th>
                                <th class="p-6 text-center">Venda Unit.</th>
                                <th class="p-6 text-right">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="listaProdutos" class="divide-y divide-gray-800 text-white">
                            <tr><td colspan="5" class="p-20 text-center text-gray-500 italic">Buscando dados...</td></tr>
                        </tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>

    <!-- MODAL DE CADASTRO / EDIÇÃO -->
    <div id="modal" class="fixed inset-0 bg-black/90 backdrop-blur-sm hidden items-center justify-center z-[100] p-4">
        <div class="bg-gray-800 p-8 rounded-3xl border border-gray-700 w-full max-w-md shadow-2xl text-white">
            <h3 id="modal-titulo" class="text-xl font-bold text-green-500 mb-6">Cadastrar Tabaco</h3>
            <form id="formProduto" class="space-y-4">
                <input type="hidden" id="produto-id">
                
                <div>
                    <label class="text-[10px] uppercase text-gray-500 font-bold ml-1">Nome do Produto</label>
                    <input type="text" id="nome" class="w-full bg-gray-900 p-4 rounded-xl border border-gray-700 focus:border-green-500 outline-none mt-1" required>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-[10px] uppercase text-gray-500 font-bold ml-1">Quantidade</label>
                        <input type="number" id="estoque" class="w-full bg-gray-900 p-4 rounded-xl border border-gray-700 focus:border-green-500 outline-none mt-1" required>
                    </div>
                    <div>
                        <label class="text-[10px] uppercase text-gray-500 font-bold ml-1">Custo Unitário (R$)</label>
                        <input type="number" step="0.01" id="custo" class="w-full bg-gray-900 p-4 rounded-xl border border-gray-700 focus:border-green-500 outline-none mt-1" required>
                    </div>
                </div>

                <div>
                    <label class="text-[10px] uppercase text-gray-500 font-bold ml-1">Preço de Venda (R$)</label>
                    <input type="number" step="0.01" id="preco" class="w-full bg-gray-900 p-4 rounded-xl border border-gray-700 focus:border-green-500 outline-none mt-1" required>
                </div>

                <div class="flex gap-3 pt-6">
                    <button type="button" onclick="fecharModal()" class="flex-1 bg-gray-700 p-4 rounded-xl font-bold text-white">Cancelar</button>
                    <button type="submit" id="btn-salvar" class="flex-1 bg-green-600 p-4 rounded-xl font-bold text-white">Salvar Produto 🚀</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import { supabase } from '../supabaseClient.js';

        let editando = false;

        async function loadUI() {
            try {
                const [sb, hd] = await Promise.all([
                    fetch('../sidebar.html').then(r => r.text()),
                    fetch('../header.html').then(r => r.text())
                ]);
                document.getElementById('sidebar-container').innerHTML = sb;
                document.getElementById('header-container').innerHTML = hd;
                document.getElementById('page-title').innerText = "Gestão de Estoque e Custos";
            } catch (e) { console.error("Erro UI:", e); }
        }

        async function loadProducts() {
            const tbody = document.getElementById('listaProdutos');
            const { data, error } = await supabase.from('produtos').select('*').order('nome');
            
            if (error) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-10 text-center text-red-500">Erro: ${error.message}</td></tr>`;
                return;
            }

            let custoTotalGlobal = 0;
            let vendaTotalGlobal = 0;

            tbody.innerHTML = data.length ? data.map(p => {
                const custo = p.preco_custo || 0; // Certifique-se de que a coluna existe no banco
                const saldo = p.estoque_atual || 0;
                const venda = p.preco_venda || 0;

                custoTotalGlobal += (custo * saldo);
                vendaTotalGlobal += (venda * saldo);

                return `
                    <tr class="hover:bg-white/5 transition border-b border-gray-800/50 text-white">
                        <td class="p-6 font-bold">${p.nome}</td>
                        <td class="p-6 text-center font-bold ${saldo < 10 ? 'text-red-500' : 'text-white'}">${saldo} un</td>
                        <td class="p-6 text-center text-blue-400 font-mono italic text-sm">R$ ${custo.toFixed(2)}</td>
                        <td class="p-6 text-center text-green-400 font-mono font-bold">R$ ${venda.toFixed(2)}</td>
                        <td class="p-6 text-right space-x-2">
                            <button onclick="editarProduto('${p.id}', '${p.nome}', ${saldo}, ${venda}, ${custo})" class="text-blue-400 hover:text-blue-200 text-xs font-bold uppercase">Editar</button>
                            <button onclick="excluirProduto('${p.id}', '${p.nome}')" class="text-red-900 hover:text-red-500 text-xs font-bold uppercase">Excluir</button>
                        </td>
                    </tr>`;
            }).join('') : `<tr><td colspan="5" class="p-20 text-center text-gray-600">Catálogo vazio.</td></tr>`;

            // Atualiza Resumo Financeiro
            document.getElementById('resumo-custo-total').innerText = `R$ ${custoTotalGlobal.toFixed(2)}`;
            document.getElementById('resumo-venda-total').innerText = `R$ ${vendaTotalGlobal.toFixed(2)}`;
            document.getElementById('resumo-lucro-total').innerText = `R$ ${(vendaTotalGlobal - custoTotalGlobal).toFixed(2)}`;
        }

        window.abrirModal = () => {
            editando = false;
            document.getElementById('formProduto').reset();
            document.getElementById('modal-titulo').innerText = "Novo Produto";
            document.getElementById('modal').classList.replace('hidden', 'flex');
        };

        window.fecharModal = () => document.getElementById('modal').classList.replace('flex', 'hidden');

        window.editarProduto = (id, nome, estoque, preco, custo) => {
            editando = true;
            document.getElementById('produto-id').value = id;
            document.getElementById('nome').value = nome;
            document.getElementById('estoque').value = estoque;
            document.getElementById('preco').value = preco;
            document.getElementById('custo').value = custo;
            document.getElementById('modal-titulo').innerText = "Editar Produto";
            document.getElementById('modal').classList.replace('hidden', 'flex');
        };

        window.excluirProduto = async (id, nome) => {
            if (confirm(`Excluir permanentemente "${nome}"?`)) {
                const { error } = await supabase.from('produtos').delete().eq('id', id);
                if (error) alert(error.message); else loadProducts();
            }
        };

        document.getElementById('formProduto').onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('produto-id').value;
            const dados = {
                nome: document.getElementById('nome').value,
                estoque_atual: parseInt(document.getElementById('estoque').value),
                preco_venda: parseFloat(document.getElementById('preco').value),
                preco_custo: parseFloat(document.getElementById('custo').value) // Coluna preco_custo
            };

            const { error } = editando 
                ? await supabase.from('produtos').update(dados).eq('id', id)
                : await supabase.from('produtos').insert([dados]);

            if (error) alert("Erro ao salvar. Verifique se a coluna 'preco_custo' existe no Supabase.");
            else { fecharModal(); loadProducts(); }
        };

        loadUI();
        loadProducts();
    </script>
</body>
</html>
