<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Splitfilling - CRM Profissional</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Ajuste de altura responsiva para rolagem de tela */
        .main-content { height: calc(100vh - 75px); }
        @media (min-width: 1024px) { .main-content { height: calc(100vh - 80px); } }
    </style>
</head>
<body class="bg-gray-950 text-white font-sans overflow-hidden">
    
    <div class="flex h-screen w-screen overflow-hidden">
        <div id="sidebar-container" class="no-print"></div>

        <div class="flex flex-col flex-1 min-w-0 overflow-hidden">
            <div id="header-container" class="no-print"></div>

            <main class="main-content overflow-y-auto p-4 sm:p-6 md:p-8 bg-black/20 no-scrollbar pt-[95px] lg:pt-[105px]">
                
                <div class="max-w-5xl mx-auto space-y-6">
                    
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b border-gray-900 pb-4">
                        <div>
                            <h3 class="text-2xl sm:text-3xl font-black text-green-500 uppercase tracking-tight italic">CRM / CLIENTES</h3>
                            <p class="text-xs text-gray-500 uppercase tracking-wider mt-0.5">Gestão de parceiros e segmentação da Splitfilling.</p>
                        </div>
                        <button onclick="window.abrirModal()" class="w-full sm:w-auto bg-green-600 hover:bg-green-500 text-black font-black px-6 py-4 rounded-2xl text-xs uppercase tracking-widest transition-all active:scale-95 shadow-lg shadow-green-900/20">
                            + Novo Cliente
                        </button>
                    </div>

                    <div class="flex gap-2 overflow-x-auto pb-2 no-scrollbar -mx-4 px-4 sm:mx-0 sm:px-0">
                        <button onclick="window.fetchClientes()" class="flex-shrink-0 px-5 py-2.5 bg-gray-900 hover:bg-gray-800 rounded-xl text-xs font-black uppercase tracking-wider transition">Todos</button>
                        <button onclick="window.filtrar('Distribuidor')" class="flex-shrink-0 px-5 py-2.5 bg-blue-950/40 border border-blue-500/20 text-blue-400 rounded-xl text-xs font-black uppercase tracking-wider hover:bg-blue-900/40 transition">Distribuidores</button>
                        <button onclick="window.filtrar('Tabacaria')" class="flex-shrink-0 px-5 py-2.5 bg-green-950/40 border border-green-500/20 text-green-400 rounded-xl text-xs font-black uppercase tracking-wider hover:bg-green-900/40 transition">Tabacarias</button>
                        <button onclick="window.filtrar('Varejo')" class="flex-shrink-0 px-5 py-2.5 bg-purple-950/40 border border-purple-500/20 text-purple-400 rounded-xl text-xs font-black uppercase tracking-wider hover:bg-purple-900/40 transition">Varejo</button>
                    </div>

                    <div class="bg-gray-900/50 rounded-[24px] border border-gray-800 overflow-hidden shadow-xl">
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse">
                                <thead class="bg-black/40 text-gray-400 text-[10px] uppercase tracking-widest font-bold">
                                    <tr>
                                        <th class="p-4 sm:p-5">Nome / Loja</th>
                                        <th class="p-4 sm:p-5">Categoria</th>
                                        <th class="p-4 sm:p-5">Cidade</th>
                                        <th class="p-4 sm:p-5 text-right">Ações</th>
                                    </tr>
                                </thead>
                                <tbody id="listaClientes" class="divide-y divide-gray-800/60 text-sm">
                                    <tr>
                                        <td colspan="4" class="p-10 text-center text-gray-500 uppercase tracking-widest text-xs font-bold animate-pulse">
                                            Buscando parceiros de negócio...
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>

                </div>
            </main>
        </div>
    </div>

    <div id="modal" class="fixed inset-0 bg-black/80 backdrop-blur-md hidden items-end sm:items-center justify-center p-0 sm:p-4 z-[300] transition-all">
        <div class="bg-gray-950 w-full sm:max-w-md p-6 sm:p-8 rounded-t-[32px] sm:rounded-[32px] border-t sm:border border-gray-800 max-h-[90vh] overflow-y-auto space-y-5">
            <div class="flex items-center justify-between">
                <h3 class="text-xl font-black text-white uppercase tracking-tight italic">Cadastrar Parceiro</h3>
                <button onclick="window.fecharModal()" class="text-gray-500 hover:text-white font-bold p-2 text-sm uppercase tracking-widest">Fechar ✕</button>
            </div>
            
            <form id="formCliente" class="space-y-4">
                <div>
                    <label class="text-[10px] uppercase text-gray-500 font-black ml-1">Nome da Loja</label>
                    <input type="text" id="nome_loja" class="w-full bg-black p-4 rounded-xl border border-gray-800 focus:border-green-500 outline-none mt-1 text-sm text-white" placeholder="Ex: Tabacaria Central" required>
                </div>

                <div>
                    <label class="text-[10px] uppercase text-gray-500 font-black ml-1">Nome do Contato (Opcional)</label>
                    <input type="text" id="nome_contato" class="w-full bg-black p-4 rounded-xl border border-gray-800 focus:border-green-500 outline-none mt-1 text-sm text-white" placeholder="Ex: Rafael Junior">
                </div>
                
                <div>
                    <label class="text-[10px] uppercase text-gray-500 font-black ml-1">Categoria de Atuação</label>
                    <select id="categoria" class="w-full bg-black p-4 rounded-xl border border-gray-800 focus:border-green-500 outline-none mt-1 text-sm text-white">
                        <option value="Tabacaria">Tabacaria (B2B)</option>
                        <option value="Distribuidor">Distribuidor (Volume)</option>
                        <option value="Varejo">Varejo (Final)</option>
                    </select>
                </div>

                <div>
                    <label class="text-[10px] uppercase text-gray-500 font-black ml-1">Cidade / Região</label>
                    <input type="text" id="cidade" class="w-full bg-black p-4 rounded-xl border border-gray-800 focus:border-green-500 outline-none mt-1 text-sm text-white" placeholder="Ex: Campinas - SP">
                </div>

                <button type="submit" class="w-full bg-green-600 text-black font-black p-4 rounded-xl transition-all uppercase tracking-widest text-xs mt-4 active:scale-95 shadow-lg shadow-green-950/20">
                    Salvar Lojista 🚀
                </button>
            </form>
        </div>
    </div>

    <script type="module">
        import { supabase } from '../supabaseClient.js';

        async function inicializarPagina() {
            try {
                // Carrega componentes de cabeçalho e navegação lateral 
                const [sb, hd] = await Promise.all([
                    fetch('../sidebar.html').then(r => r.text()),
                    fetch('../header.html').then(r => r.text())
                ]);
                document.getElementById('sidebar-container').innerHTML = sb;
                document.getElementById('header-container').innerHTML = hd;
                
                // Força o re-disparo assíncrono das funções touch do menu hambúrguer 
                const scripts = document.getElementById('sidebar-container').getElementsByTagName('script');
                for (let script of scripts) { eval(script.text); }

                document.getElementById('page-title').innerText = "CRM de Parceiros";
                await fetchClientes();
            } catch (e) {
                console.error("Erro estrutural de injeção no CRM:", e);
            }
        }

        async function fetchClientes() {
            const tbody = document.getElementById('listaClientes');
            const { data, error } = await supabase.from('clientes').select('*').order('nome_loja', { ascending: true });
            
            if (error) {
                tbody.innerHTML = `<tr><td colspan="4" class="p-5 text-center text-red-500 font-bold">Erro: ${error.message}</td></tr>`;
                return;
            }
            renderTabela(data);
        }

        window.filtrar = async (cat) => {
            const tbody = document.getElementById('listaClientes');
            tbody.innerHTML = `<tr><td colspan="4" class="p-10 text-center text-gray-500 uppercase tracking-widest text-xs font-bold animate-pulse">Filtrando lista...</td></tr>`;
            
            const { data, error } = await supabase.from('clientes').select('*').eq('categoria', cat).order('nome_loja', { ascending: true });
            if (!error) renderTabela(data);
        };

        function renderTabela(lista) {
            const tbody = document.getElementById('listaClientes');
            
            if (!lista || lista.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="p-10 text-center text-gray-500 uppercase tracking-widest text-xs">Nenhum cliente cadastrado nesta categoria.</td></tr>`;
                return;
            }

            tbody.innerHTML = lista.map(c => `
                <tr class="hover:bg-gray-900/30 transition-all border-b border-gray-900/50">
                    <td class="p-4 sm:p-5 font-bold text-white flex flex-col">
                        <span>${c.nome_loja}</span>
                        <span class="text-[10px] text-gray-500 font-medium normal-case lg:hidden mt-0.5">Contato: ${c.nome_contato || 'Não informado'}</span>
                    </td>
                    <td class="p-4 sm:p-5">
                        <span class="px-2.5 py-1 rounded-full text-[9px] font-black uppercase tracking-wider ${
                            c.categoria === 'Distribuidor' ? 'bg-blue-500/10 text-blue-400' : 
                            c.categoria === 'Tabacaria' ? 'bg-green-500/10 text-green-400' : 'bg-purple-500/10 text-purple-400'
                        }">
                            ${c.categoria || 'Tabacaria'}
                        </span>
                    </td>
                    <td class="p-4 sm:p-5 font-mono text-xs uppercase text-gray-400">${c.cidade || 'Campinas - SP'}</td>
                    <td class="p-4 sm:p-5 text-right">
                        <button onclick="window.excluirCliente('${c.id}')" class="text-[10px] bg-red-950/20 border border-red-900/30 hover:bg-red-600 hover:border-transparent text-red-400 hover:text-white px-3 py-1.5 rounded-xl font-black uppercase tracking-wider transition">Remover</button>
                    </td>
                </tr>`).join('');
        }

        window.abrirModal = () => {
            const m = document.getElementById('modal');
            m.classList.remove('hidden');
            m.classList.add('flex');
        };

        window.fecharModal = () => {
            const m = document.getElementById('modal');
            m.classList.add('hidden');
            m.classList.remove('flex');
        };

        document.getElementById('formCliente').onsubmit = async (e) => {
            e.preventDefault();
            const { error } = await supabase.from('clientes').insert([{
                nome_loja: document.getElementById('nome_loja').value,
                nome_contato: document.getElementById('nome_contato').value || "Não informado",
                categoria: document.getElementById('categoria').value,
                cidade: document.getElementById('cidade').value || "Campinas - SP"
            }]);

            if (error) {
                alert("Erro ao salvar parceiro: " + error.message);
            } else {
                e.target.reset();
                window.fecharModal();
                await fetchClientes();
            }
        };

        window.excluirCliente = async (id) => {
            if(confirm("Deseja remover permanentemente este lojista do CRM?")) {
                const { error } = await supabase.from('clientes').delete().eq('id', id);
                if (error) alert("Erro ao deletar: " + error.message);
                else await fetchClientes();
            }
        };

        // Expõe funções críticas para escopo global do clique
        window.fetchClientes = fetchClientes;
        
        inicializarPagina();
    </script>
</body>
</html>
