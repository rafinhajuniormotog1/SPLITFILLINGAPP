<div id="sidebar-overlay" class="fixed inset-0 bg-black/60 hidden z-[180] lg:hidden backdrop-blur-sm"></div>

<script>
    (function() {
        const btn = document.getElementById('btn-hamburguer');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebar-overlay');

        function alternarMenu() {
            if (sidebar.classList.contains('-translate-x-full')) {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
                btn.innerText = "✕ Fechar";
                btn.classList.replace('bg-green-500', 'bg-red-600');
            } else {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('hidden');
                btn.innerText = "☰ Menu";
                btn.classList.replace('bg-red-600', 'bg-green-500');
            }
        }

        // Eventos de clique e toque rápido para celular
        btn.addEventListener('click', alternarMenu);
        overlay.addEventListener('click', alternarMenu);
    })();
</script>
